fidelity:
  divergences: >
    Real-valued biophysical rational ratios (Hill n=4, conductance divider, Jahr-Stevens NMDAR
    unblock, Tsodyks-Markram fixed-point STP, RESI variance, SNARE barrier tenths/fiftieths)
    are cross-multiplied and integer-scaled over Nat/Int with explicit positive-domain
    hypotheses so every theorem is proved constructively without IEEE-754 rounding or
    Classical.choice. Domain VI proves algebraic factorization vs. strict diagonal dominance
    on supplied 2x2 weight tables without formalizing interventional causality (explicitly
    verified by common-cause counterexample A05 in lean/AdversarialChecks.lean). Transcendental
    Nernst/GHK/Arrhenius/Gaussian expressions are checked externally by a 50-digit mpmath oracle.

