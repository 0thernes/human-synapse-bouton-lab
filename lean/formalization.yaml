      prompting_notes: "Human author directed scope, biophysical parameter separation (rat vs. human cortical presets), statement fidelity audit, positive-domain tightening (v1.2.0), inductive/dynamical expansion (v1.3.0), unused-hypothesis elimination, zero-Classical.choice enforcement, and Lean-to-engine vector testing (v1.4.0)."
  spend_usd: "subscription-based usage"
  notes: "Repository CI (.github/workflows/ci.yml) runs `lake comparator --paranoid` (Solution checked against Challenge with permitted_axioms = [propext, Quot.sound]), `lake check --paranoid` on all default targets (replaying lean, leanchecker-paranoid, lean4lean, nanoda, con-leche, and con-ron), `ExportVectors.lean` vector parity, and `scripts/check_readme_axioms.py` (forbidding Classical.choice); those project CI checks are recorded separately from any external registry verification."

fidelity:
  divergences: >
    Real-valued biophysical rational ratios (Hill n=4, conductance divider, Jahr-Stevens NMDAR
    unblock, Tsodyks-Markram fixed-point STP, RESI variance, SNARE barrier tenths/fiftieths)
    are cross-multiplied and integer-scaled over Nat/Int with explicit positive-domain
    hypotheses and zero unused hypotheses so every theorem is proved constructively without
    IEEE-754 rounding or Classical.choice. Domain VI proves generic 2x2 integer determinant
    facts (aliased as outer_product_det_zero, det_pos_of_diag_dominance, det_pos_of_diag_excess)
    and formalizes no causal model; A05 evaluates one example determinant, and its reading as a
    common-cause table is informal. T11 contains no voltage or exponential; T10 states numerator
    identities; T15 is an upper bound on the zero time of a deterministic mean-rate store (A07
    proves strict inequality when D divides a0), whereas the Rust Monte Carlo simulator adds
    per-second rate jitter; T17 is (8n)/8 = n with no kinesin model. Lean definitions are
    machine-tested against Python, TypeScript, and Rust engines via ExportVectors.lean ->
    data/lean_engine_vectors.json. Transcendental Nernst/GHK/Arrhenius/Gaussian expressions are
    checked externally by a 50-digit mpmath oracle.

