version: "v0.4"

project:
  name: "Human Synaptic Bouton Biophysical Invariants and 2x2 Weight-Table Factorization Bounds"
  description: >
    Pure Lean 4.35.0 (zero Mathlib, zero sorry, zero Classical.choice) formalization of
    24 elementary algebraic and discrete-dynamical invariants across six nanoscale human
    synaptic bouton modeling domains: (1) Hill n=4 Ca2+ release cooperativity with
    positive-domain guarantees (unit interval, half-max exactness, strict monotonicity,
    1/82 resting noise floor, exact 8.5x Kd/2->Kd doubling gain, exact sigmoidal crossover
    vs. linear n=1) and fixed-point Tsodyks-Markram STP single-step unit bounds;
    (2) conductance-based mature KCC2 GABAergic shunting attenuation, well-defined
    pure-shunting divisive identity, and cleared-denominator Jahr-Stevens NMDAR Mg2+
    unblock monotonicity; (3) single-step and structural-induction multi-step vesicle pool
    conservation (rat 374 & human L1 3,500), positive clamped ATP store depletion, exact
    discrete ATP depletion hitting-time upper bound, resting V-ATPase leak rate bounds,
    and exact kinesin-1 stoichiometry (125,000 ATP/mm); (4) SNAREpin Syt1/copy-number
    barrier monotonicity; (5) RESI 1/sqrt(N*K) localization variance and imager duty-cycle
    monotonicity; and (6) exact 2x2 weight-table algebraic factorization, diagonal product
    dominance, and diagonal excess implication. Paired with 26 concrete physiological
    non-vacuity witnesses (lean/NonVacuity.lean) and 6 adversarial counterexample checks
    (lean/AdversarialChecks.lean).
  authors:
    - name: "Alexander Stephen Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
  responsible_maintainers:
    - name: "Alexander Stephen Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
  license: "Apache-2.0"

