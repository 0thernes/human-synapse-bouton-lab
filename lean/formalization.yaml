version: "v0.4"

project:
  name: "Human Synaptic Bouton Biophysical Invariants and 2x2 Weight-Table Factorization Bounds"
  description: >
    Pure Lean 4.35.0 (zero Mathlib, zero sorry, zero Classical.choice) formalization of
    18 elementary algebraic invariants across six nanoscale human synaptic bouton modeling domains:
    (1) Hill n=4 Ca2+ release cooperativity with positive-domain guarantees (unit interval,
    half-maximal exactness, strict monotonicity, 1/82 resting noise floor at 3*c <= Kd with Kd > 0,
    and exact 17/2 = 8.5x doubling gain from Kd/2 = halfKd to Kd = 2*halfKd with halfKd > 0);
    (2) conductance-based mature KCC2 GABAergic shunting attenuation and well-defined pure-shunting
    divisive identity (gL, gE, gI > 0, eL < eE); (3) exact conservation of presynaptic vesicle pools
    under conservative transitions (instantiated for rat 374-vesicle and human L1 3,500-vesicle
    presets); (4) local ATP deficit depletion of a positive clamped store (`atpStoreAfter < a0`)
    and resting V-ATPase H+ leak reduction of rational (and, when cAp <= bLeak, integer floor)
    maximal sustainable firing rate; (5) exact kinesin-1 stoichiometry (125,000 ATP/mm at 8 nm/step)
    and SNAREpin Syt1/copy-number fusion-barrier monotonicity; (6) RESI 1/sqrt(N*K) localization
    variance improvement, imager duty-cycle monotonicity, and exact 2x2 weight-table algebraic
    factorization vs. strict diagonal product dominance bounds. Paired with 20 concrete
    physiological non-vacuity witnesses in lean/NonVacuity.lean.
  authors:
    - name: "Alexander Stephen Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
  responsible_maintainers:
    - name: "Alexander Stephen Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
  license: "Apache-2.0"

