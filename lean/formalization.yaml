version: "v0.4"

project:
  name: "Human Synaptic Bouton Biophysical Invariants and Bipartite Integration Bounds"
  description: >
    Pure Lean 4.35.0 (zero Mathlib, zero sorry, zero Classical.choice) formalization of
    18 exact algebraic invariants across six nanoscale human synaptic bouton domains:
    (1) Hill n=4 Ca2+ release cooperativity (unit interval, half-maximal exactness, strict
    monotonicity, 1/82 resting noise floor at c <= Kd/3, and exact 17/2 = 8.5x doubling gain);
    (2) conductance-based mature KCC2 GABAergic shunting attenuation and pure-shunting divisive
    identity; (3) exact conservation of presynaptic vesicle pools under conservative exocytosis,
    priming, and mobilization (instantiated for both rat 374-vesicle and human cortical L1
    3,500-vesicle baselines); (4) local ATP deficit depletion and resting V-ATPase H+ leak
    reduction of sustainable firing frequency; (5) exact kinesin-1 processive stoichiometry
    (125,000 ATP/mm at 8 nm/step) and SNAREpin Syt1/copy-number fusion-barrier monotonicity;
    (6) RESI 1/sqrt(N*K) localization variance improvement, imager duty-cycle monotonicity,
    and discrete 2x2 bipartite causal-coupling bounds (zero coupling for factorized states vs.
    strictly positive coupling for aligned presynaptic-postsynaptic nanocolumns). Paired with
    19 concrete physiological non-vacuity witnesses in lean/NonVacuity.lean.
  authors:
    - name: "Alexander Stephen Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
  responsible_maintainers:
    - name: "Alexander Stephen Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
  license: "Apache-2.0"

