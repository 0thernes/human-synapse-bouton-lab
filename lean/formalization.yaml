fidelity:
  divergences: >
    Real-valued biophysical rational ratios (Hill n=4, conductance divider, RESI variance,
    SNARE barrier tenths/fiftieths) are cross-multiplied and integer-scaled over Nat/Int with
    explicit positive-domain hypotheses so every theorem is proved exactly without IEEE-754
    rounding or Classical.choice. Domain VI proves algebraic factorization vs. strict diagonal
    product dominance on supplied 2x2 weight tables without formalizing interventional causality
    or geometric nanocolumn alignment-to-weight maps. Transcendental Nernst/GHK/Arrhenius/Gaussian
    expressions are checked externally by a 50-digit mpmath oracle (python/synapse_science/oracle.py).

