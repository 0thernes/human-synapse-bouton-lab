version: "v0.4"

project:
  name: "Elementary Integer Invariants of a Human Synaptic Bouton Model and 2x2 Integer Determinant Facts"
  description: >
    Lean 4.35.0 (no Mathlib; no sorry in proof modules; no Classical.choice in any printed
    axiom list) proofs of 24 elementary integer and list-induction lemmas about the
    repository's own model formulas, stated over Nat/Int with denominators cleared:
    (1) Hill n=4 inequalities (below 1, value 1/2 at c = kd, strict increase in c, at most
    1/82 when 3c <= kd, ratio 17/2 between c = kd and c = kd/2, crossover with c/(c+kd))
    and one Tsodyks-Markram update step; (2) bounds for a conductance-weighted mean, two
    numerator identities for pure shunting, and monotonicity of D/(D+m*e) in an abstract
    natural e (the form used for Jahr-Stevens Mg2+ unblock; voltage dependence not
    formalised); (3) single-step and list-induction vesicle pool conservation, strict drop
    of a truncated linear ATP store, an upper bound on the time at which that mean-rate store
    reaches 0, leak lowering the sustainable rate, and (8n)/8 = n (no kinesin model);
    (4) non-strict monotonicity of a clamped SNARE barrier formula; (5) RESI variance and
    duty-cycle inequalities; and (6) 2x2 integer determinant facts (rank-one tables have
    determinant 0; diagonal excess gives a nonzero determinant). Paired with 27 non-vacuity
    witness theorems (lean/NonVacuity.lean) and 6 sanity and sharpness checks
    (lean/AdversarialChecks.lean). These are known elementary facts; no published open
    question is resolved. The Lean definitions are hand-written integer analogues of the
    TypeScript/Rust engines, with no tested link. Prior formal work on biological models
    includes marpaia/grn-lean (Lean 4, Hill-kinetic gene-regulatory circuits), Bobbin et
    al., Digital Discovery 3:264 (2024), doi:10.1039/D3DD00077J, and arXiv:2505.05362.
  authors:
    - name: "Alexander Stephen Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
  responsible_maintainers:
    - name: "Alexander Stephen Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
  license: "Apache-2.0"

