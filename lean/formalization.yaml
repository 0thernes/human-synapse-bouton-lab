version: "v0.4"

project:
  name: "Elementary Integer Invariants of a Human Synaptic Bouton Model and 2x2 Integer Determinant Facts"
  description: >
    Lean 4.35.0 (no Mathlib; no sorry in proof modules; zero Classical.choice enforced by
    comparator.json and CI; zero unused hypotheses) proofs of 24 elementary integer and
    list-induction lemmas about the repository's own model formulas, stated over Nat/Int
    with denominators cleared: (1) Hill n=4 inequalities (below 1, positive-denominator
    half-max at c = kd, strict increase in c, at most 1/82 when 3c <= kd, ratio 17/2 between
    c = kd and c = kd/2, crossover with c/(c+kd)) and one Tsodyks-Markram update step;
    (2) bounds for a conductance-weighted mean, two numerator identities for pure shunting,
    and monotonicity of D/(D+m*e) in an abstract natural e (the form used for Jahr-Stevens
    Mg2+ unblock; voltage dependence not formalised); (3) single-step and list-induction
    vesicle pool conservation, strict drop of a truncated linear ATP store, an upper bound
    on the zero time of that deterministic mean-rate store, leak lowering the sustainable
    rate, and (8n)/8 = n (no kinesin model); (4) non-strict monotonicity of a clamped SNARE
    barrier formula; (5) RESI variance and duty-cycle inequalities; and (6) 2x2 integer
    determinant facts (rank-one tables have determinant 0; diagonal excess gives a nonzero
    determinant). Paired with 27 non-vacuity witness theorems (lean/NonVacuity.lean), 7
    sanity and sharpness checks (lean/AdversarialChecks.lean), and an executable Lean-to-engine
    test-vector bridge (lean/ExportVectors.lean -> data/lean_engine_vectors.json asserted in
    Python, TypeScript, and Rust tests). These are known elementary facts; no published open
    question is resolved.
  authors:
    - name: "Alexander Stephen Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
  responsible_maintainers:
    - name: "Alexander Stephen Donahue"
      github: "0thernes"
      orcid: "0009-0006-8168-9648"
  license: "Apache-2.0"

