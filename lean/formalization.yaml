fidelity:
  divergences: >
    Real-valued biophysical rational ratios (Hill n=4, conductance divider, RESI variance,
    SNARE barrier tenths/fiftieths) are cross-multiplied and integer-scaled over Nat/Int so
    every theorem is proved exactly without IEEE-754 rounding or Classical.choice. Transcendental
    Nernst/GHK/Arrhenius/Gaussian expressions are checked externally by a 50-digit mpmath oracle
    (python/synapse_science/oracle.py) rather than inside Lean.

