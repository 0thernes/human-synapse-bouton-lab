# Informational CI: runs on every push to main and reports. It is never a required check and gates nothing.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly, catches dependency drift

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect stacks
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.d.outputs.node }}
      python: ${{ steps.d.outputs.python }}
      rust: ${{ steps.d.outputs.rust }}
      go: ${{ steps.d.outputs.go }}
      ruby: ${{ steps.d.outputs.ruby }}
      java: ${{ steps.d.outputs.java }}
      c-cpp: ${{ steps.d.outputs.c-cpp }}
      dotnet: ${{ steps.d.outputs.dotnet }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: bash scripts/dev.sh detect | tee -a "$GITHUB_OUTPUT"
      - name: Summary
        run: |
          {
            echo "### Detected stacks"
            bash scripts/dev.sh detect | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  node:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - run: corepack enable || true
      - run: bash scripts/dev.sh setup node
      - run: bash scripts/dev.sh build node
      - run: bash scripts/dev.sh test node
      - run: bash scripts/dev.sh lint node
        continue-on-error: true

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - uses: astral-sh/setup-uv@v5
        continue-on-error: true
      - run: bash scripts/dev.sh setup python
      - run: bash scripts/dev.sh test python
      - run: bash scripts/dev.sh lint python
        continue-on-error: true

  rust:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: bash scripts/dev.sh build rust
      - run: bash scripts/dev.sh test rust
      - run: bash scripts/dev.sh lint rust
        continue-on-error: true

  go:
    needs: detect
    if: needs.detect.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: bash scripts/dev.sh build go
      - run: bash scripts/dev.sh test go
      - run: bash scripts/dev.sh lint go
        continue-on-error: true

  ruby:
    needs: detect
    if: needs.detect.outputs.ruby == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: ruby, bundler-cache: true }
      - run: bash scripts/dev.sh test ruby
      - run: bash scripts/dev.sh lint ruby
        continue-on-error: true

  java:
    needs: detect
    if: needs.detect.outputs.java == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
      - run: bash scripts/dev.sh build java
      - run: bash scripts/dev.sh test java

  c-cpp:
    needs: detect
    if: needs.detect.outputs.c-cpp == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/dev.sh build c-cpp
      - run: bash scripts/dev.sh test c-cpp

  dotnet:
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: bash scripts/dev.sh setup dotnet
      - run: bash scripts/dev.sh build dotnet
      - run: bash scripts/dev.sh test dotnet

  standard:
    name: Build Standard audit (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Audit
        run: bash scripts/audit-repo.sh --json audit.json --markdown "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with: { name: build-standard-audit, path: audit.json }

  security:
    name: Security scan (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (secrets in full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 0 --report-format json --report-path gitleaks.json
          echo "gitleaks findings: $(grep -c '"RuleID"' gitleaks.json || true)" >> "$GITHUB_STEP_SUMMARY"
      - name: osv-scanner (known-vulnerable dependencies)
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner --recursive . > osv.txt 2>&1 || true
          { echo '### osv-scanner'; echo '```'; tail -n 40 osv.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: security-reports, path: "gitleaks.json\nosv.txt" }
