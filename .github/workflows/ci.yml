# Informational CI: runs on every push to main and reports. Never a required check; gates nothing (R1-R3).
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean 4.35.0 Multi-Kernel Proof Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan & Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install bubblewrap (bwrap)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap || true
      - name: Forbidden token scan on proof modules
        run: |
          ! sed 's/--.*$//' lean/Solution.lean lean/NonVacuity.lean lean/AdversarialChecks.lean lean/VerifyAxioms.lean | \
            grep -nE '\b(sorry|admit|native_decide)\b|^\s*axiom\b|implemented_by|@\[extern'
      - name: Build proofs (--wfail), verify axioms, replay leanchecker & 6 independent kernels
        working-directory: lean
        run: |
          lake build --wfail
          lake env lean VerifyAxioms.lean | tee ../lean-axioms-ci.txt
          ! grep -E '\b(sorryAx|Classical\.choice|Lean\.ofReduceBool|Lean\.trustCompiler)\b|_native' ../lean-axioms-ci.txt
          lake env leanchecker Solution
          lake env leanchecker NonVacuity
          lake env leanchecker AdversarialChecks
          lake env leanchecker-paranoid Solution
          lake env leanexport Solution > .lake/solution.ndjson
          # Note: standalone nanoda_bin checks transitive Init declarations (which reference Classical.choice internally);
          # zero Classical.choice on all 24 exported theorems is strictly enforced by comparator.json, VerifyAxioms grep, and check_readme_axioms.py.
          printf '{"export_file_path":".lake/solution.ndjson","permitted_axioms":["propext","Classical.choice","Quot.sound"],"unpermitted_axiom_hard_error":false,"nat_extension":true,"string_extension":true}\n' > .lake/nanoda.json
          lake env nanoda_bin .lake/nanoda.json
          lake env con-ron .lake/solution.ndjson
          lake env con-leche .lake/solution.ndjson
          lake check --paranoid || lake check --paranoid --inadvisably-no-sandbox
          lake comparator --config comparator.json --paranoid || lake comparator --config comparator.json --paranoid --inadvisably-no-sandbox
          lake env lean --run ExportVectors.lean > .lake/exported_vectors_ci.json
          diff -u ../data/lean_engine_vectors.json .lake/exported_vectors_ci.json
      - name: Verify README verbatim axiom block matches kernel output
        run: python3 scripts/check_readme_axioms.py --axioms-file lean-axioms-ci.txt
      - name: Upload Lean axiom report
        uses: actions/upload-artifact@v7
        with:
          name: lean-axioms-report
          path: lean-axioms-ci.txt

  node:
    name: TypeScript & WebGL Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: node examples/nanocolumn_example.mjs
      - run: npm run lint
        continue-on-error: true

  rust:
    name: Rust Monte Carlo Engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo build --release --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked
        continue-on-error: true

  python-and-differential:
    name: Python 50-Digit Oracle & 1,000-Case Cross-Language Differential (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v10.4.0
      - run: npm ci && npm run build --workspace=@synapse/core
      - run: cargo build --release --locked
      - run: uv sync --extra dev --frozen
      - run: uv run pytest -v python/tests/
      - run: uv run python examples/exact_oracle_example.py
      - run: uv run ruff check python/ && uv run mypy python/synapse_science/
        continue-on-error: true

  standard:
    name: Build Standard v1.2.0 Audit (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: bash scripts/audit-repo.sh --json audit.json --markdown "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        with: { name: build-standard-audit, path: audit.json }

  security:
    name: Security Scan (gitleaks + osv-scanner, report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks (secrets in full history)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 0 --report-format json --report-path gitleaks.json
          echo "gitleaks findings: $(grep -c '"RuleID"' gitleaks.json || true)" >> "$GITHUB_STEP_SUMMARY"
      - name: osv-scanner (known-vulnerable dependencies)
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner --recursive . > osv.txt 2>&1 || true
          { echo '### osv-scanner'; echo '```'; tail -n 40 osv.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with: { name: security-reports, path: "gitleaks.json\nosv.txt" }
