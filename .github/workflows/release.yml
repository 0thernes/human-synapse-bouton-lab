# Runs after a v* tag is pushed. Publishes notes from CHANGELOG.md, artifacts, SHA256SUMS and build provenance attestations.
# It never gates a push: the tag is already pushed when this starts.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Check version consistency
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          [ "$file" = "$tag" ] || echo "::warning::VERSION ($file) does not match tag ($tag)"
          grep -Eq "^## \[$tag\]" CHANGELOG.md || echo "::warning::CHANGELOG.md has no section for $tag"

      - name: Build artifacts
        run: |
          mkdir -p dist
          name="${GITHUB_REPOSITORY#*/}"
          git archive --format=tar.gz --prefix="$name-$GITHUB_REF_NAME/" -o "dist/$name-$GITHUB_REF_NAME-source.tar.gz" "$GITHUB_REF_NAME"
          git archive --format=zip --prefix="$name-$GITHUB_REF_NAME/" -o "dist/$name-$GITHUB_REF_NAME-source.zip" "$GITHUB_REF_NAME"
          cp docs/lean-axioms-report.txt dist/lean-axioms-report.txt
          [ -f MANIFEST.sha256 ] && cp MANIFEST.sha256 dist/MANIFEST.sha256 || true
          [ -f MANIFEST.sha256.tsr ] && cp MANIFEST.sha256.tsr dist/MANIFEST.sha256.tsr || true
          [ -f MANIFEST.sha256.ots ] && cp MANIFEST.sha256.ots dist/MANIFEST.sha256.ots || true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%f\n' | sort > ../artifact-list.txt
          xargs sha256sum < ../artifact-list.txt > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        continue-on-error: true   # attestations need a public repo (or GitHub Enterprise Cloud); never block the release
        with:
          subject-path: "dist/*"

      - name: Release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
          {
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS\` and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
          } >> notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
