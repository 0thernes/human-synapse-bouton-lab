# Publishes docs/ (or a project-built _site/) to GitHub Pages on every push to main.
# Skips gracefully when Pages is not enabled (Settings > Pages > Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: extractions/setup-just@v2
        if: steps.pages.outcome == 'success'
        continue-on-error: true
      - name: Project site (just site, if defined)
        if: steps.pages.outcome == 'success'
        run: |
          if command -v just >/dev/null && just --summary 2>/dev/null | tr ' ' '\n' | grep -qx site; then just site; fi
      - name: Build docs/ with Jekyll
        if: steps.pages.outcome == 'success' && hashFiles('_site/index.html') == ''
        uses: actions/jekyll-build-pages@v1
        with: { source: ./docs, destination: ./_site }
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with: { path: ./_site }

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
