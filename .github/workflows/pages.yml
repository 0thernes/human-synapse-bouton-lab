# Builds the static Vite + Three.js interactive workbench plus Lean 4 Proof Blueprint
# and deploys both to GitHub Pages (Build Standard A27 + Playbook v1.3 Finding 15).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - run: npm ci
      - run: npm run build
      - name: Stage interactive Lean 4 Proof Blueprint at /blueprint/
        run: |
          mkdir -p apps/web/dist/blueprint
          cp -r blueprint/* apps/web/dist/blueprint/
          touch apps/web/dist/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
