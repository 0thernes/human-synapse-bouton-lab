# yaml-language-server: $schema=./repo-standard.schema.json
# Project manifest for the Build Standard for LLMs v1.1.0. Read by scripts/audit-repo.sh and Audit-Repo.ps1.
# Keep each item on one line. status: done | todo | partial | n/a (n/a needs a note).
standard: "1.1.0"
name: "human-synapse-bouton-lab"
description: "Full-stack, formally verified human synaptic bouton biophysical workbench, Lean 4.35.0 proofs, stochastic Monte Carlo nanocolumn simulator, and 11-discipline open hard problems & consciousness frontier monograph."
owner: "0thernes"
year: "2026"
project_type: research  # library | cli | service | web-app | desktop-app | mobile-app | data | ml | ai-app | research | docs | infra | game | other
stack: [node, python, rust, lean]  # e.g. [python, node]; scripts/dev.sh also auto-detects
flags:  # true | false | auto
  public: true  # published openly (community files, About, citation)
  package: true  # installable library or tool (auto: a package manifest exists)
  visual: true  # has visible output worth a screenshot or GIF (auto: ui)
  ui: true  # has a user interface (auto: tsx/jsx/vue/svelte/html/xaml/swift files outside docs)
  native: false  # native or unsafe code (auto: C/C++/asm sources)
  ai: false  # calls or ships an AI model (auto: AI SDK names in code or manifests)
  personal_data: false  # collects, stores, processes or logs personal data
  service: true  # long-running service, server or job
  deployed: false  # deployed somewhere
  api: true  # exposes or consumes an API, file format or protocol
  perf: true  # makes speed or efficiency claims
  concurrent: false  # concurrent, parallel or async code
  numeric: true  # numeric, scientific, financial, ML or simulation code
  experimental: true  # makes experimental, statistical or research claims
  ml: false  # trains, fine-tunes or selects ML models
  formal: true  # has a critical core worth formal methods
